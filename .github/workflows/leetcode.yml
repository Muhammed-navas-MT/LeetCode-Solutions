name: LeetCode Sync

on:
  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

  # Runs every day at 10:00 PM IST
  # 10:00 PM IST = 4:30 PM UTC
  schedule:
    - cron: "30 16 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python .github/scripts/leetcode_sync.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add solutions

          if git diff --cached --quiet; then
            echo "No new LeetCode solutions found."
          else
            git commit -m "[LeetCode] Sync accepted solutions"
            git push
          fi
